# Dark Mode: Everforest Dark

# Style pane borders
set -g pane-border-style fg=colour0
set -g pane-active-border-style "bg=default fg=colour0"

# Style status line
set -g status-bg colour8  # Dark gray background
set -g status-fg colour4  # Light blue text

set -g status-left ""
set -g status-right ""
set -g status-justify left

set-option -g status-position bottom

# Set the color for inactive windows (visible against the dark background)
setw -g window-status-format '#[fg=colour7,bg=colour8] #W '  # Light gray on dark gray

# Set the color for the active window (clearly distinguishable)
setw -g window-status-current-format '#[fg=colour0,bg=colour4] #W '  # Black on light blue
